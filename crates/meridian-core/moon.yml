$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'application'
language: 'rust'

tasks:
  build:
    command: 'cargo build -p meridian-core'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'

  test:
    command: 'cargo test -p meridian-core'
    deps: ['build']
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'

  lint:
    command: 'cargo clippy -p meridian-core --all-targets -- -D warnings'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'

  format:
    command: 'cargo fmt -p meridian-core -- --check'
    inputs:
      - 'src/**/*'
