# cargo-deny configuration — CI license/SCA scan (spec/10-licensing.md, LIC-008).
# Run with: cargo deny check
# Incompatible copyleft dependencies must never be introduced (LIC-008); this file is the
# enforcement point, not just documentation.

[graph]
targets = []

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Allowlist: permissive licenses compatible with BSL -> Apache-2.0 relicensing (LIC-004).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
# Anything not explicitly allowed (including GPL/AGPL/LGPL/SSPL-style copyleft) fails CI.
confidence-threshold = 0.8
# Our own crates are BUSL-1.1 by design (LIC-001) — that's not a blanket allow for a
# third-party BUSL dependency (which LIC-008 wants reviewed individually), so it's scoped
# per-crate here instead of added to `allow`. New internal crates need an entry too.
exceptions = [
    { allow = ["BUSL-1.1"], crate = "meridian-core" },
    { allow = ["BUSL-1.1"], crate = "meridian-types" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
