name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  DATABASE_URL: postgres://meridian:meridian@localhost:5432/meridian?sslmode=disable

jobs:
  lint:
    name: Lint (clippy + rustfmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins channel/components/targets; rustup honors it automatically.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install moon
        run: curl -fsSL https://moonrepo.dev/install/moon.sh | bash
      - run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon run :lint
      - run: moon run :format

  test:
    name: Test (Postgres 18)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: meridian
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install moon
        run: curl -fsSL https://moonrepo.dev/install/moon.sh | bash
      - run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install dbmate
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate
      - run: dbmate up
      - run: moon run :test

  db-docs:
    name: Schema docs are up to date (tbls)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: meridian
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install dbmate
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate
      - run: dbmate up
      - name: Install tbls
        run: curl -sL https://raw.githubusercontent.com/k1LoW/tbls/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Fail if docs/db has drifted from the live schema (DAT-* PRs must run `task db:docs`)
        run: tbls diff

  license:
    name: License / SCA scan (LIC-008)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --locked
      - run: cargo deny check

  docker:
    name: Docker bake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate bake config
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          push: false
          set: |
            *.platform=linux/amd64
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          push: true
          set: |
            *.tags=ghcr.io/fdarkshadow/meridian-core/core:${{ github.sha }}
